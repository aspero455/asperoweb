services:
  # Backend Service
  - type: web
    name: asperoweb-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Service
  - type: web
    name: asperoweb-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && yarn install && yarn build
    startCommand: cd frontend && yarn global add serve && serve -s build -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 18
